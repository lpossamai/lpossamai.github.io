repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      # - id: no-commit-to-branch
      #   args: [--branch, main]
  - repo: local
    hooks:
      - id: stamp-assets
        name: stamp asset cache-busting hashes
        entry: python3 scripts/stamp_assets.py
        language: system
        files: ^(index\.html|styles\.css|site\.js|theme-init\.js)$
        pass_filenames: false
